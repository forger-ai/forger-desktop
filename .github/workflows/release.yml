name: Release Desktop

on:
  push:
    tags:
      - 'forger-desktop/v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forger-desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/forger-docs
          path: .forger-docs

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/vite-fastapi-sqlite-skeleton
          path: resources/app-skeletons/vite-fastapi-sqlite
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/resources/requirements.txt

      - run: npm ci
      - run: python -m pip install -r test/resources/requirements.txt
      - run: |
          node scripts/ensure-electron-installed.mjs
          node -e "require('electron'); console.log('electron ready')"
        shell: bash
      - run: node scripts/validate-release-tag.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage:electron:strict
      - run: npm run test:coverage:renderer
      - run: npm run test:resources

      - id: meta
        run: |
          echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: release:ci:mac
            artifacts: |
              forger-desktop-macos-arm64.dmg
              forger-desktop-macos-x64.dmg
          - os: ubuntu-latest
            script: dist:linux:built
            artifacts: |
              forger-desktop-linux-x64.deb
          - os: windows-latest
            script: dist:win:built
            artifacts: |
              forger-desktop-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/forger-docs
          path: .forger-docs

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/vite-fastapi-sqlite-skeleton
          path: resources/app-skeletons/vite-fastapi-sqlite
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/resources/requirements.txt

      - run: npm ci
      - run: python -m pip install -r test/resources/requirements.txt
      - run: |
          node scripts/ensure-electron-installed.mjs
          node -e "require('electron'); console.log('electron ready')"
        shell: bash
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:electron:focused:built
      - run: npm run test:renderer
      - run: npm run test:resources

      - name: Run Electron smoke under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e:built

      - name: Run Electron smoke
        if: runner.os != 'Linux'
        run: npm run test:e2e:built

      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK || secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME || secrets.MACOS_CSC_NAME }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Check artifact exists
        shell: bash
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          while IFS= read -r artifact; do
            [ -z "$artifact" ] && continue
            test -f "release/$artifact"
          done <<< "$ARTIFACTS"

      - name: Write checksum
        shell: bash
        env:
          ARTIFACTS: ${{ matrix.artifacts }}
        run: |
          while IFS= read -r artifact; do
            [ -z "$artifact" ] && continue
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "release/$artifact" > "release/$artifact.sha256"
            else
              certutil -hashfile "release/$artifact" SHA256 | awk -v file="release/$artifact" 'NR==2 {print $1 "  " file}' > "release/$artifact.sha256"
            fi
          done <<< "$ARTIFACTS"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-desktop-artifacts
          path: |
            release/forger-desktop-*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      PAGES_TOKEN: ${{ secrets.FORGER_PAGES_WORKFLOW_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#forger-desktop/v}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME must exist with changelog notes before publishing artifacts."
            exit 1
          fi
          RELEASE_BODY="$(gh release view "$TAG_NAME" --json body --jq .body)"
          if [ -z "$RELEASE_BODY" ] || [ "$RELEASE_BODY" = "Forger Desktop v$VERSION" ]; then
            echo "Release $TAG_NAME is missing changelog notes."
            exit 1
          fi
          gh release upload "$TAG_NAME" release-artifacts/* --clobber
          gh release edit "$TAG_NAME" --latest

      - name: Trigger Pages desktop metadata refresh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "FORGER_PAGES_WORKFLOW_TOKEN is not configured; skipping Pages metadata refresh."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAGES_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/forger-ai/forger-ai.github.io/dispatches \
            -d "{\"event_type\":\"desktop-release\",\"client_payload\":{\"tag\":\"$TAG_NAME\"}}"
