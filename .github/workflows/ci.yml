name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/forger-docs
          path: .forger-docs

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/vite-fastapi-sqlite-skeleton
          path: resources/app-skeletons/vite-fastapi-sqlite
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/resources/requirements.txt

      - run: npm ci
      - run: python -m pip install -r test/resources/requirements.txt
      - run: |
          node scripts/ensure-electron-installed.mjs
          node -e "require('electron'); console.log('electron ready')"
        shell: bash
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage:electron:strict
      - run: npm run test:coverage:renderer
      - run: npm run test:resources
      - run: npm run build

  electron-platforms:
    name: Electron behavior (${{ matrix.scope }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scope: full
            script: test:electron
          - os: macos-latest
            scope: focused
            script: test:electron:focused
          - os: windows-latest
            scope: focused
            script: test:electron:focused
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/forger-docs
          path: .forger-docs

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/vite-fastapi-sqlite-skeleton
          path: resources/app-skeletons/vite-fastapi-sqlite
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: |
          node scripts/ensure-electron-installed.mjs
          node -e "require('electron'); console.log('electron ready')"
        shell: bash
      - run: npm run ${{ matrix.script }}

  electron-smoke:
    name: Real Electron smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/forger-docs
          path: .forger-docs

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/vite-fastapi-sqlite-skeleton
          path: resources/app-skeletons/vite-fastapi-sqlite
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: |
          node scripts/ensure-electron-installed.mjs
          node -e "require('electron'); console.log('electron ready')"
        shell: bash
      - run: npm run build

      - name: Run Electron smoke under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e:built

      - name: Run Electron smoke
        if: runner.os != 'Linux'
        run: npm run test:e2e:built
