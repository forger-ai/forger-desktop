name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/forger-docs
          path: .forger-docs

      - uses: actions/checkout@v5
        with:
          repository: forger-ai/vite-fastapi-sqlite-skeleton
          path: resources/app-skeletons/vite-fastapi-sqlite
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: |
          node scripts/ensure-electron-installed.mjs
          node -e "require('electron'); console.log('electron ready')"
        shell: bash
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
